name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install -y rsync rclone fpart
      - name: Run regression and local integration tests
        run: python -m unittest discover -s tests -v
